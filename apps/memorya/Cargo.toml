[package]
name = "memorya"
version.workspace = true
edition.workspace = true
description = "Local-first memory layer for the agent driver: capture, hybrid recall, consolidation, archive"
license.workspace = true

[[bin]]
name = "memorya"
path = "src/main.rs"

[[bin]]
name = "memorya-eval"
path = "eval/main.rs"

[lib]
name = "memorya"
path = "src/lib.rs"

[dependencies]
contracts.workspace = true
tillerd-paths.workspace = true
gate-client.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
redact.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.11"
strsim = "0.11"
ignore = "0.4"
# Static embedding model (default features include the model hub, so the model is
# downloaded on first use and cached for offline reuse).
model2vec-rs = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
