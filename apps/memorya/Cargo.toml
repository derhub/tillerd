[package]
name = "memorya"
version = "0.1.0"
edition = "2021"
description = "Local-first memory layer for the agent driver: capture, hybrid recall, consolidation, archive"
license = "MIT"

[[bin]]
name = "memorya"
path = "src/main.rs"

[[bin]]
name = "memorya-eval"
path = "eval/main.rs"

[lib]
name = "memorya"
path = "src/lib.rs"

[dependencies]
contracts-rs = { path = "../../packages/contracts-rs" }
gate-client = { path = "../../packages/gate-client" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
strsim = "0.11"
ignore = "0.4"
redact = { path = "../../packages/redact-rs", package = "redact-rs" }
# Static embedding model (default features include the model hub, so the model is
# downloaded on first use and cached for offline reuse).
model2vec-rs = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
