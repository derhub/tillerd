[package]
name = "engram-rs"
version = "0.1.0"
edition = "2021"
description = "Local-first memory layer for the agent driver: capture, hybrid recall, consolidation, archive"
license = "MIT"

[[bin]]
name = "engram"
path = "src/main.rs"

[[bin]]
name = "engram-eval"
path = "eval/main.rs"

[lib]
name = "engram"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
strsim = "0.11"
ignore = "0.4"
redact = { path = "../../packages/redact-rs", package = "redact-rs" }
# Static embedding model (default features include the model hub, so the model is
# downloaded on first use and cached for offline reuse).
model2vec-rs = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
