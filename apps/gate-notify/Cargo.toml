[package]
name = "tillerd-gate-notify"
version = "0.1.0"
edition = "2021"
description = "Hook callback client: frames the agent lifecycle payload to the gate's hook socket"
license = "MIT"

[[bin]]
name = "gate-notify"
path = "src/main.rs"

[dependencies]
contracts = { path = "../../packages/contracts-rs", package = "tillerd-contracts-rs" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
