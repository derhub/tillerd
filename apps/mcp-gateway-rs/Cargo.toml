[package]
name = "tillerd-mcp-gateway-rs"
version = "0.1.0"
edition = "2021"
description = "Lightweight local-first MCP gateway: aggregates many MCP servers behind one MCP face"
license = "MIT"

[lib]
name = "tillerd_mcp_gateway"
path = "src/lib.rs"

[[bin]]
name = "tillerd-mcp-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "gen-schema"
path = "src/bin/gen_schema.rs"

# Minimal MCP server used as a real backend in integration tests.
[[bin]]
name = "stub-backend"
path = "src/bin/stub_backend.rs"

[dependencies]
rmcp = { version = "1.7", features = [
  "server",
  "client",
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
  "server-side-http",
  "elicitation",
  "macros",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "process",
  "time",
  "signal",
  "net",
  "io-util",
] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
contracts = { path = "../../packages/contracts-rs", package = "tillerd-contracts-rs" }
service-host = { path = "../../packages/service-host", package = "tillerd-service-host" }
process-launch = { path = "../../packages/process-launch", package = "tillerd-process-launch" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
