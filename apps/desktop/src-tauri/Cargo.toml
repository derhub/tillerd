[package]
name = "tillerd-desktop"
version.workspace = true
edition.workspace = true
description = "A Tauri App"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tillerd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros", "fs", "time"] }
dirs = "6"
libc = "0.2"
tillerd-paths.workspace = true
contracts.workspace = true
process-launch.workspace = true
orchestrator = { workspace = true, features = ["specta"] }
uuid.workspace = true
# Typed IPC bindings generation (build-time; export gated behind the `specta` feature).
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
# Native OS notification banners for background (unfocused) events (roadmap 0.0.10).
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
# Opens clicked terminal links (detected URLs + OSC 8) in the system browser.
tauri-plugin-opener = "2"
# Enabled by the `webdriver` feature for the desktop e2e harness; off in normal/release builds.
tauri-plugin-webdriver = { version = "0.2", optional = true }

# Persists/restores window size, position, and maximized state across relaunch (desktop only).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[features]
# Embeds a W3C WebDriver server so the e2e harness can drive the app.
webdriver = ["dep:tauri-plugin-webdriver"]

[dev-dependencies]
tempfile.workspace = true
serial_test = "4"
# `tauri::test` mock runtime for the IPC command-contract test.
tauri = { version = "2", features = ["test"] }
# Span-counting layer proving the off-telemetry channel send opens no bus span.
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
