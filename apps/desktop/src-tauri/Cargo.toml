[package]
name = "tillerd-desktop"
version.workspace = true
edition.workspace = true
description = "A Tauri App"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tillerd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros", "fs", "time"] }
dirs = "6"
libc = "0.2"
tillerd-paths.workspace = true
contracts.workspace = true
process-launch.workspace = true
orchestrator.workspace = true
uuid.workspace = true
# Enabled by the `webdriver` feature for the desktop e2e harness; off in normal/release builds.
tauri-plugin-webdriver = { version = "0.2", optional = true }

[features]
# Embeds a W3C WebDriver server so the e2e harness can drive the app.
webdriver = ["dep:tauri-plugin-webdriver"]

[dev-dependencies]
tempfile.workspace = true
serial_test = "3"

[lints]
workspace = true
