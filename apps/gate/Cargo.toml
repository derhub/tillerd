[package]
name = "tillerd-gate"
version.workspace = true
edition.workspace = true
description = "Composable middleware gate: per-session auth, hook normalization and fan-out, and tool-route pass-through over loopback"
license.workspace = true

[lib]
name = "tillerd_gate"
path = "src/lib.rs"

[[bin]]
name = "tillerd-gate"
path = "src/bin/main.rs"

[dependencies]
contracts.workspace = true
service-host.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "io-util",
  "time",
  "signal",
] }
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
bytes = "1"
subtle = "2"
# Confined to `endpoint/mcp.rs`: gate owns only the request->Inbound bridge; the
# router, Kind, and middleware never name an rmcp type. The MCP face is served over
# the gate's single Unix socket only — no HTTP/TCP transport.
rmcp = { workspace = true, features = ["server", "transport-io"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile.workspace = true
# Integration tests drive the MCP face with an in-process client over the same
# socket/stream transport the server uses; no HTTP client transport is needed.
rmcp = { workspace = true, features = ["client", "transport-io"] }
serde_json.workspace = true
contracts.workspace = true

[lints]
workspace = true
