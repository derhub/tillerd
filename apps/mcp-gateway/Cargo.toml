[package]
name = "tillerd-mcp-gateway"
version.workspace = true
edition.workspace = true
description = "Lightweight local-first MCP gateway: aggregates many MCP servers behind one MCP face"
license.workspace = true

[lib]
name = "tillerd_mcp_gateway"
path = "src/lib.rs"

[[bin]]
name = "tillerd-mcp-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "gen-schema"
path = "src/bin/gen_schema.rs"

# Minimal MCP server used as a real backend in integration tests.
[[bin]]
name = "stub-backend"
path = "src/bin/stub_backend.rs"

[dependencies]
rmcp = { workspace = true, features = [
  "server",
  "client",
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
  "server-side-http",
  "elicitation",
  "macros",
] }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "process",
  "time",
  "signal",
  "net",
  "io-util",
] }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
schemars = "1"
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
contracts.workspace = true
service-host.workspace = true
process-launch.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
