[workspace]
resolver = "3"
members = [
  "crates/contracts",
  "crates/paths",
  "crates/service-host",
  "crates/process-launch",
  "crates/daemon-pty-client",
  "crates/gate-client",
  "crates/custom-macro",
  "crates/orchestrator",
  "crates/redact",
  "apps/daemon-pty",
  "apps/memorya",
  "apps/gate",
  "apps/gate-notify",
  "apps/mcp-gateway",
  "apps/desktop/src-tauri",
  "tests/integration",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT"
rust-version = "1.84"

[workspace.dependencies]
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# error handling
thiserror = "2"
anyhow = "1"
# async runtime
tokio = "1"
# observability
tracing = "0.1"
tracing-subscriber = "0.3"
# identifiers
uuid = { version = "1", features = ["v4"] }
# platform
nix = "0.31"
# filesystem watch (vetted cross-platform watcher; see non-blocking-io memory)
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# mcp
rmcp = "1.7"
# typed tauri bindings (RC toolchain -- pinned exact; build-time only, output committed + drift-guarded)
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# testing
tempfile = "3"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tillerd-custom-macro = { path = "crates/custom-macro" }
# internal
tillerd-paths = { path = "crates/paths" }
contracts = { path = "crates/contracts", package = "tillerd-contracts" }
gate-client = { path = "crates/gate-client", package = "tillerd-gate-client" }
daemon-pty-client = { path = "crates/daemon-pty-client", package = "tillerd-daemon-pty-client" }
service-host = { path = "crates/service-host", package = "tillerd-service-host" }
process-launch = { path = "crates/process-launch", package = "tillerd-process-launch" }
orchestrator = { path = "crates/orchestrator", package = "tillerd-orchestrator" }
redact = { path = "crates/redact", package = "tillerd-redact" }

# Lint groups carry priority = -1 so the individual lints below override them;
# equal priority is a hard error under `cargo clippy -- -D warnings`.
[workspace.lints.rust]
future-incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
unused_unsafe = "deny"
deprecated = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"

[profile.release]
opt-level = 3
lto = "thin"
