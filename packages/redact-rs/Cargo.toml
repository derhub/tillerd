[package]
name = "redact-rs"
version = "0.1.0"
edition = "2021"
description = "Detect-then-transform redaction of credentials and structured PII"
license = "MIT"

[lib]
name = "redact"
path = "src/lib.rs"

[[bin]]
name = "redact"
path = "src/main.rs"

[dependencies]
regex = "1"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
