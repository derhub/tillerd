[package]
name = "tillerd-service-host"
version = "0.1.0"
edition = "2021"
description = "Uniform run-me lifecycle for long-lived tools: path resolution, atomic manifest, signal-driven graceful shutdown, and an unauthenticated liveness probe"
license = "MIT"

[lib]
name = "service_host"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "signal",
  "io-util",
  "time",
  "process",
] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
