[package]
name = "tillerd-contracts-rs"
version = "0.1.0"
edition = "2021"
description = "Shared wire types for the composable tools: canonical HookEvent, ids, and subscription + tool-route message shapes"
license = "MIT"

[lib]
name = "contracts"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
