[package]
name = "tillerd-process-launch"
version = "0.1.0"
edition = "2021"
description = "Adopt-or-spawn launcher for managed tool backends: manifest adoption, spawn-field diffing, bounded-backoff restart"
license = "MIT"

[lib]
name = "process_launch"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nix = { version = "0.31", features = ["signal", "process"] }

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
