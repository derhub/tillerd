[package]
name = "gate-client"
version = "0.1.0"
edition = "2021"
description = "Client-side codec for the gate hook-subscription wire (framing + typed frames)"
license = "MIT"

[lib]
name = "gate_client"
path = "src/lib.rs"

[dependencies]
contracts-rs = { path = "../contracts-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
