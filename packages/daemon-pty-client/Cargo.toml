[package]
name = "tillerd-daemon-pty-client"
version = "0.1.0"
edition = "2021"
description = "Client-side codec for the daemon PTY session-event wire (framing + typed frames)"
license = "MIT"

[lib]
name = "daemon_pty_client"
path = "src/lib.rs"

[dependencies]
contracts = { path = "../contracts-rs", package = "tillerd-contracts-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
