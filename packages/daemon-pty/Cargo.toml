[package]
name = "tillerd"
version = "0.1.0"
edition = "2021"
description = "Native (Rust) generic terminal-backend daemon, wire-compatible with @tillerd/daemon"
license = "MIT"

[[bin]]
name = "tillerd-daemon"
path = "src/main.rs"

[dependencies]
contracts = { path = "../contracts-rs", package = "tillerd-contracts-rs" }
service-host = { path = "../service-host", package = "tillerd-service-host" }
portable-pty = "0.9"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "signal",
  "io-util",
  "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["signal", "process", "ioctl"] }
base64 = "0.22"
command-fds = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
