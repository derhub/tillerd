[package]
name = "tillerd-orchestrator"
version.workspace = true
edition.workspace = true
description = "Runtime-agnostic backend orchestrator: boot lifecycle, service supervision, and the durable product store, embedded in-process by a host"
license.workspace = true

[lib]
name = "orchestrator"
path = "src/lib.rs"

[dependencies]
contracts.workspace = true
tillerd-paths.workspace = true
daemon-pty-client.workspace = true
process-launch.workspace = true
service-host.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
sqlx.workspace = true
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
tillerd-custom-macro = { path = "../custom-macro" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "macros",
  "time",
] }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "macros",
  "time",
] }

[features]
# Derive specta::Type on the wire-facing *View read DTOs so the desktop build can
# generate typed TS bindings. Off by default -- non-desktop consumers compile untouched.
specta = ["dep:specta", "dep:specta-typescript"]

[lints]
workspace = true
