name: apt-deps
description: >
  Install apt packages with a complete cache. On a cache hit it skips
  `apt-get update` and the download, installing the cached .debs via dpkg
  (dpkg runs the packages' post-install scripts, so runtime registration —
  gdk-pixbuf loaders, gsettings schemas — works for the e2e app run).

inputs:
  packages:
    description: Space-delimited apt packages to install (the full dependency closure is cached).
    required: true
  version:
    # Bump this to force every job's apt cache to rebuild on the next run.
    description: Cache version — increment to invalidate all apt caches.
    default: "1"

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: echo "hash=$(printf '%s' "$PACKAGES" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      id: cache
      with:
        path: ~/apt-debs
        key: apt-${{ runner.os }}-v${{ inputs.version }}-${{ steps.key.outputs.hash }}
    # Miss: refresh the index and download the full closure into a user-owned dir
    # (the system archive is root-owned and actions/cache can't restore there).
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        sudo apt-get update
        mkdir -p ~/apt-debs
        sudo apt-get install -y --download-only -o Dir::Cache::archives="$HOME/apt-debs" $PACKAGES
    # Always install from the local .debs — no update, no network on a hit.
    - shell: bash
      run: sudo dpkg -i ~/apt-debs/*.deb || sudo apt-get install -f -y
