version: 2
updates:
  # bun.lock
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "UTC"
    groups:
      security:
        patterns:
          - "*"
        applies-to: "security-updates"
      version-updates:
        patterns:
          - "*"
        applies-to: "version-updates"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps-bun)"

  # Cargo.lock
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:10"
      timezone: "UTC"
    groups:
      security:
        patterns:
          - "*"
        applies-to: "security-updates"
      version-updates:
        patterns:
          - "*"
        applies-to: "version-updates"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps-cargo)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci(actions)"
