version: 2
updates:
  # bun.lock — daily
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps-bun)"

  # Cargo.lock — daily
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:10"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps-cargo)"

  # GitHub Actions — weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci(actions)"
