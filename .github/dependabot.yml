version: 2
updates:
  # bun.lock security — daily
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
    groups:
      security:
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "minor"
          - "major"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps-bun)"

  # bun.lock version — weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:05"
    groups:
      minor-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
    ignore:
      - dependency-name: "*"
        update-types:
          - "patch"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps-bun)"

  # Cargo security — daily
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:10"
    groups:
      security:
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "minor"
          - "major"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps-cargo)"

  # Cargo version — weekly
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "01:15"
    groups:
      minor-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
    ignore:
      - dependency-name: "*"
        update-types:
          - "patch"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps-cargo)"

  # GitHub Actions — weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "01:20"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci(actions)"
