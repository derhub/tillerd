name: autofix.ci # must keep this name

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # clippy --fix fetches crates; keep a transient crates.io HTTP/2 hiccup from redding the run.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # clippy --fix compiles the workspace; the desktop crate links GTK/webkit on Linux.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: "1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      # The desktop crate's clippy build.rs embeds the UI dist, so build it before clippy.
      - run: bunx turbo run build --filter=@tillerd/ui
      # Apply machine-applicable lint fixes (clippy for Rust, oxlint for JS/TS), then format
      # (oxfmt for JS/TS + cargo fmt for Rust).
      - run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged
      - run: bunx oxlint --fix .
      - run: bun run format
      # autofix.ci rejects changes under .github; workflow files are pipeline configuration, not source formatting.
      - run: git restore --source=HEAD -- .github
      - id: autofix
        continue-on-error: true
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
      - name: Wait for submitted fix
        if: steps.autofix.outputs.autofix_started == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
          ORIGINAL_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 30); do
            sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
            if [ -n "$sha" ] && [ "$sha" != "$ORIGINAL_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for autofix.ci to push the fix commit" >&2
          exit 1
      - name: Fail unexpected autofix error
        if: steps.autofix.outcome != 'success' && steps.autofix.outputs.autofix_started != 'true'
        run: exit 1
