name: release-smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release workspace already compiles in CI: the e2e job builds the desktop release binary on
  # both Linux and macOS (E2E_BUNDLED), and the test job compiles every crate. A standalone
  # `cargo build --release --workspace` here only duplicated that, so it was dropped.
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx changeset status || true
      - name: bun pm pack --dry-run every public package
        run: |
          fail=0
          while IFS= read -r pkg; do
            dir=$(dirname "$pkg")
            if ! grep -q '"private": true' "$pkg"; then
              echo "::group::pack $dir"
              (cd "$dir" && bun pm pack --dry-run) || fail=1
              echo "::endgroup::"
            fi
          done < <(find apps packages -maxdepth 2 -name package.json)
          exit $fail
