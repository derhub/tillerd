name: release-smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crates-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo build --release --workspace

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx changeset status || true
      - name: bun pm pack --dry-run every public package
        run: |
          fail=0
          while IFS= read -r pkg; do
            dir=$(dirname "$pkg")
            if ! grep -q '"private": true' "$pkg"; then
              echo "::group::pack $dir"
              (cd "$dir" && bun pm pack --dry-run) || fail=1
              echo "::endgroup::"
            fi
          done < <(find apps packages -maxdepth 2 -name package.json)
          exit $fail
