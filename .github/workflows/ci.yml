name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/autofix.yml
  workflow_run:
    workflows: ["autofix.ci"]
    types: [completed]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  # crates.io fetches intermittently die with "[16] Error in the HTTP2 framing layer"; disabling
  # HTTP/2 multiplexing and retrying hard keeps a transient registry hiccup from redding the run.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

# Verify-only jobs: hand the third-party action the least token it needs.
permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_branch || github.sha }}
      # The desktop crate (clippy) links GTK/webkit on Linux.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: "1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-latest-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # clippy compiles the crates itself; only the UI dist (the desktop crate's build.rs input) is
      # prebuilt — building the release service binaries here would be thrown away.
      - run: bunx turbo run build --filter=@tillerd/ui
      # Formatting is owned by autofix.ci (auto-fixes oxfmt + cargo fmt and red-gates the PR).
      - run: bun run check-types
      - run: bun run lint
      # Rust gate: promote every warn-level lint (incl. deprecated=deny, clippy::all) to a hard error.
      - run: cargo clippy --workspace --all-targets -- -D warnings


  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_branch || github.sha }}
      # The desktop crate (test) links GTK/webkit on Linux.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: "1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-latest-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # cargo test builds its own debug binaries; only the UI dist (desktop build.rs input) is prebuilt.
      - run: bunx turbo run build --filter=@tillerd/ui
      - run: bun run test

  e2e:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_branch || github.sha }}
      # Linux drives WKWebView through webkit2gtk-driver under a virtual display; macOS drives its
      # native WKWebView in-process (tauri-plugin-webdriver), so it needs neither apt deps nor xvfb.
      - if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
          version: "1"
          # The e2e app run needs the packages' post-install scripts (gdk-pixbuf loaders,
          # gsettings schemas) — the custom action ran them via dpkg; this opts back in.
          execute_install_scripts: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo install tauri-webdriver --locked
        # E2E_BUNDLED also boot-checks the release binary, so the suite runs against both a dev and
        # a bundled build (dev-verification spec).
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun --filter @tillerd/desktop-e2e e2e
        env:
          E2E_BUNDLED: "1"
      - if: runner.os == 'macOS'
        run: bun --filter @tillerd/desktop-e2e e2e
        env:
          E2E_BUNDLED: "1"

  arch:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.sha }}
      # ast-grep enforces the structural code rules in .ast-grep/ (openspec: setup-ast-grep).
      # Config (sgconfig.yml) drives ruleDirs + tests; pinned via npm.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.43.0
      # Gate: scan exits non-zero on any `error`-severity finding (warnings do not fail).
      - run: ast-grep scan
      # Rule unit tests (valid/invalid fixtures + snapshots) must pass.
      - run: ast-grep test
