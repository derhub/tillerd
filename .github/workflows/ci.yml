name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TILLERD_DAEMON_BIN: ${{ github.workspace }}/bin/tillerd-daemon
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run verify

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TILLERD_DAEMON_BIN: ${{ github.workspace }}/bin/tillerd-daemon
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-ubuntu-latest-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-ui-${{ github.sha }}
          restore-keys: |
            turbo-ui-
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:ui
