# bacon — background code checker. https://dystroy.org/bacon/
# Run `bacon` in a terminal; it re-runs the default job on every save.
# Switch jobs with keybindings: c = check, l = clippy, n = nextest.

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.nextest]
command = ["cargo", "nextest", "run", "--workspace", "--color", "always"]
need_stdout = true
analyzer = "nextest"

[keybindings]
c = "job:check"
l = "job:clippy"
n = "job:nextest"
