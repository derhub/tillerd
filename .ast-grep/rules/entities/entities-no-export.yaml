id: entities-no-export
language: Rust
severity: error
message: >-
  entities/ is internal and must not be exported: no `pub use …entities…` re-export
  and no `pub mod entities`. A public re-export makes a domain newtype reachable as
  `orchestrator::app::…::Entity`, defeating the boundary even if the module is private.
  Expose a primitive or a `Serialize` read DTO from app/ instead.
note: |
  Don't re-export the entity through a public edge — return a primitive/DTO:

    // instead of: pub use crate::entities::SurfaceId;   (now public surface)
    pub struct SurfaceView { pub id: String, /* … */ }   // flat, Serialize

  `pub(crate) use crate::entities::X;` and `pub(crate) mod entities;` are allowed —
  they keep the item crate-private. The tree is green (lib.rs declares
  `pub(crate) mod entities;` and no `pub use` of an entity remains), so this is
  enforced (error).
rule:
  any:
    - kind: use_declaration
      regex: '^pub use\s+.*\bentities\b'
    - kind: mod_item
      regex: '^pub mod entities\b'
